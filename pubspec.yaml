name: habit_constellation
description: "Every habit you practice becomes a star"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  clock: ^1.1.1
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  flutter_local_notifications: ^22.3.1
  shared_preferences: ^2.5.3
  timezone: ^0.11.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
